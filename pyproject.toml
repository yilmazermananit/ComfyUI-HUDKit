[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-hudkit"
version = "0.1.1"
description = "Designed HUD video overlays from native SAM3 tracking. Consumes native SAM3_TRACK_DATA / BOUNDING_BOX / MASK and the user's transparent PNG frame & target assets to render stable-identity, captioned, color-coded HUD graphics. No third-party bbox bridge nodes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "DifferentGuys Studio (YEA)", email = "erman@differentguys.studio" }]
keywords = ["comfyui", "sam3", "tracking", "hud", "overlay", "video", "compositing"]

# Runtime deps kept minimal for Comfy Cloud / Registry compatibility.
# torch is provided by the ComfyUI environment and is intentionally NOT listed.
dependencies = ["numpy", "Pillow"]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/yilmazermananit/ComfyUI-HUDKit"
"Bug Tracker" = "https://github.com/yilmazermananit/ComfyUI-HUDKit/issues"

# --- Comfy Registry metadata (docs.comfy.org/registry/specifications) -------
[tool.comfy]
# Verify this PublisherId in the Comfy Registry before a registry release.
PublisherId = "yilmazermananit"
DisplayName = "ComfyUI-HUDKit"
# SAM3 native nodes + BOUNDING_BOX/SAM3_TRACK_DATA types landed in ComfyUI v0.20.1.
requires-comfyui = ">=0.20.1"
# Icon (<=400x400 square) / Banner (21:9) may be added as hosted URLs before publish.

[tool.setuptools]
# Only ship the runtime package + web assets; tests/docs/examples are dev-only
# (see .comfyignore for the Registry packaging excludes).
packages = ["yea_hud", "nodes"]
include-package-data = true

[tool.setuptools.package-data]
yea_hud = ["fonts/*.ttf", "fonts/*.txt", "fonts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ComfyUI's root entry point is a loader hook, not a pytest package initializer.
addopts = "--confcutdir=tests"
