[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-yonderhud"
version = "0.1.0"
description = "Designed HUD video overlays from native SAM3 tracking. Consumes native SAM3_TRACK_DATA / BOUNDING_BOX / MASK and the user's transparent PNG frame & target assets to render stable-identity, captioned, color-coded HUD graphics. No third-party bbox bridge nodes."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "DifferentGuys Studio (Yonder)", email = "erman@differentguys.studio" }]
keywords = ["comfyui", "sam3", "tracking", "hud", "overlay", "video", "compositing"]

# Runtime deps kept minimal for Comfy Cloud / Registry compatibility.
# torch is provided by the ComfyUI environment and is intentionally NOT listed.
dependencies = ["numpy", "Pillow"]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
# REQUIRED by the Comfy Registry. Replace with the real repo before publishing.
Repository = "https://github.com/yonder/ComfyUI-YonderHUD"
"Bug Tracker" = "https://github.com/yonder/ComfyUI-YonderHUD/issues"

# --- Comfy Registry metadata (docs.comfy.org/registry/specifications) -------
[tool.comfy]
# PublisherId is the value after '@' on your registry.comfy.org profile.
# This is a PLACEHOLDER — set it to your real PublisherId before `comfy node publish`.
PublisherId = "yonder"
DisplayName = "ComfyUI-YonderHUD"
# SAM3 native nodes + BOUNDING_BOX/SAM3_TRACK_DATA types landed in ComfyUI v0.20.1.
requires-comfyui = ">=0.20.1"
# Icon (<=400x400 square) / Banner (21:9) may be added as hosted URLs before publish.

[tool.setuptools]
# Only ship the runtime package + web assets; tests/docs/examples are dev-only
# (see .comfyignore for the Registry packaging excludes).
packages = ["yonder_hud", "nodes"]
include-package-data = true
